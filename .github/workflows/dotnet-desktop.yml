name: Build LiteView MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform: [x86, x64]
    runs-on: windows-2022
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}

    - name: Restore Dependencies
      run: dotnet restore LiteView.slnx

    - name: Build MSIX (${{ matrix.platform }})
      run: |
        dotnet build LiteView.slnx `
          -c Release `
          -p:Platform=${{ matrix.platform }} `
          -p:AppxBundle=Never `
          -p:AppxPackageDir="${{ github.workspace }}\AppPackages\" `
          -p:GenerateAppxPackageOnBuild=true `
          -p:UapAppxPackageBuildMode=SideloadOnly

    - name: Generate Attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: '${{ github.workspace }}\AppPackages\*.msix'

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LiteView-${{ matrix.platform }}-Release
        path: ${{ github.workspace }}\AppPackages\
